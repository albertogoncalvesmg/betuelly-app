<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .wordmark {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Montserrat', 'SF Pro Display', sans-serif;
        font-weight: 700;
        font-size: 104px;
        fill: #002D62;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- 
    SYMBOL: Proprietary Continuous-Line "B" 
    Constructed from exact geometric arcs and overlapping loop structure (Brand Book p. 5)
  -->
  <g id="Betuelly-Symbol" transform="translate(60, 20)">
    <!-- Continuous Monoline B Path (Deep Institutional Blue #002D62) -->
    <path d="M 36 122 
             L 36 74 
             A 52 52 0 1 1 88 126 
             L 86 126" 
          fill="none" 
          stroke="#002D62" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <path d="M 88 94 
             L 106 94 
             A 58 58 0 1 1 106 210 
             L 56 210 
             L 56 144 
             A 50 50 0 0 1 106 94" 
          fill="none" 
          stroke="#002D62" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Turquoise Connection Nodes (#00C2C3) -->
    <circle cx="36" cy="132" r="13" fill="#00C2C3" />
    <circle cx="82" cy="132" r="13" fill="#00C2C3" />
  </g>

  <!-- 
    WORDMARK: "BETUELLY"
    Deep Institutional Blue (#002D62), Bold Contemporary Sans-Serif, Open Tracking
  -->
  <text x="265" y="178" class="wordmark">BETUELLY</text>
</svg>
